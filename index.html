<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#132b34}
body{display:flex;align-items:center;justify-content:center}
#app{position:relative;width:min(100vw,520px);height:100vh;max-height:940px;overflow:hidden;background:#bfe8ff;box-shadow:0 0 30px #0008}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;top:0;left:0;right:0;z-index:4;padding:10px;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;pointer-events:none}
.badge{background:#fffef3e8;border:3px solid #1d6a59;border-radius:999px;padding:7px 11px;text-align:center;font-weight:900;color:#174f43;box-shadow:0 4px 0 #174d42;font-size:15px}
#combo{color:#c04e00;min-width:92px}
#warning{position:absolute;inset:0;pointer-events:none;z-index:3;opacity:0;border:10px solid #e11;border-radius:4px}
#tip{position:absolute;left:14px;right:14px;bottom:145px;z-index:5;display:none;background:#fffdf0;border:4px solid #d92d20;border-radius:18px;padding:12px 14px;box-shadow:0 7px 0 #8d1c14}
#tipTitle{font-weight:900;font-size:19px;color:#b21e16}
#tipText{font-weight:800;color:#5d2924;line-height:1.5;margin-top:3px}
#overlay{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px;background:#173b438f}
.card{width:100%;max-height:92vh;overflow:auto;background:#fffdf2;border:5px solid #1d6a59;border-radius:28px;padding:21px;text-align:center;box-shadow:0 11px 0 #154b40}
h1{margin:0;color:#17634f;font-size:30px;line-height:1.2}
.subtitle{font-weight:900;color:#ee6338;margin:6px 0 13px}
.rules{text-align:left;background:#fff1c9;border-radius:16px;padding:12px 14px;font-weight:800;color:#59472d;line-height:1.65;font-size:15px}
button{border:0;border-radius:999px;padding:13px 27px;margin-top:14px;background:#ed6539;color:#fff;font-size:20px;font-weight:900;box-shadow:0 6px 0 #ad3818;cursor:pointer}
.mini{font-size:13px;color:#777;margin-top:10px;line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:13px 0}
.stat{background:#fff0c6;border-radius:14px;padding:9px;font-weight:900;color:#7a4b12}
.rank{font-size:31px;font-weight:900;color:#ec6436;margin-top:8px}
#soundBtn{position:absolute;right:10px;top:60px;z-index:6;width:42px;height:42px;border-radius:50%;border:3px solid #1d6a59;background:#fffef2;font-size:20px;box-shadow:0 4px 0 #174d42;padding:0;margin:0}

#brandBar{
 position:absolute;left:10px;right:10px;top:58px;z-index:6;
 display:flex;align-items:center;justify-content:space-between;gap:8px;
 pointer-events:none
}
.brandChip{
 background:#0c5b4de8;color:#fff;border:2px solid #fff8;border-radius:999px;
 padding:6px 10px;font-weight:900;font-size:12px;box-shadow:0 3px 0 #083f36
}
#shareBtn,#homeBtn{
 pointer-events:auto;border:0;border-radius:999px;padding:8px 12px;margin:0;
 background:#fffef2;color:#125f51;font-size:13px;font-weight:900;
 box-shadow:0 4px 0 #174d42
}
#toast{
 position:absolute;left:50%;bottom:155px;transform:translateX(-50%);
 z-index:20;background:#153c42e8;color:#fff;padding:10px 16px;border-radius:999px;
 font-weight:900;display:none;white-space:nowrap
}
#leaderPanel{
 margin-top:12px;background:#f6f9f2;border:3px solid #9fc5b4;border-radius:16px;
 padding:10px;text-align:left
}
#leaderPanel h3{margin:0 0 6px;color:#195f50;text-align:center}
#leaderList{margin:0;padding-left:22px;font-weight:900;color:#4a4438;line-height:1.6}
.footer165{
 margin-top:12px;background:#fff0d5;border:3px solid #ed6539;border-radius:16px;
 padding:10px;font-weight:900;color:#9a3519
}
.versionTag{
 display:inline-block;margin-top:7px;background:#174f43;color:#fff;border-radius:999px;
 padding:5px 11px;font-size:13px;font-weight:900
}


#scoreFxLayer{
 position:absolute;inset:0;z-index:9;pointer-events:none;overflow:hidden;
}
.scorePopup{
 position:absolute;transform:translate(-50%,-50%);
 font-size:32px;font-weight:1000;white-space:nowrap;
 text-shadow:-3px -3px 0 #fff,3px -3px 0 #fff,-3px 3px 0 #fff,3px 3px 0 #fff,0 5px 8px #0005;
 animation:scoreRise 1.15s ease-out forwards;
}
.scorePopup.good{color:#078a48}
.scorePopup.bad{color:#e21b1b;font-size:35px}
@keyframes scoreRise{
 0%{opacity:0;transform:translate(-50%,-20%) scale(.55)}
 18%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}
 55%{opacity:1;transform:translate(-50%,-105%) scale(1)}
 100%{opacity:0;transform:translate(-50%,-180%) scale(.9)}
}

</style>

function beep(type){
 if(!soundOn)return;
 try{
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);
  const now=audioCtx.currentTime;
  if(type==='good'){o.frequency.setValueAtTime(660,now);o.frequency.exponentialRampToValueAtTime(880,now+.12);}
  if(type==='star'){o.frequency.setValueAtTime(880,now);o.frequency.exponentialRampToValueAtTime(1320,now+.2);}
  if(type==='bad'){o.type='sawtooth';o.frequency.setValueAtTime(220,now);o.frequency.exponentialRampToValueAtTime(110,now+.28);}
  if(type==='win'){o.frequency.setValueAtTime(523,now);o.frequency.setValueAtTime(659,now+.12);o.frequency.setValueAtTime(784,now+.24);}
  g.gain.setValueAtTime(.001,now);g.gain.exponentialRampToValueAtTime(.22,now+.02);g.gain.exponentialRampToValueAtTime(.001,now+.34);
  o.start(now);o.stop(now+.36);
 }catch(e){}
}

 {emoji:'🍬',label:'糖果',value:10,speed:180},
 {emoji:'🥭',label:'臺南芒果',value:20,speed:186},
 {emoji:'🍍',label:'臺南鳳梨',value:30,speed:192},
 {emoji:'⭐',label:'反詐之星',value:50,speed:198,type:'star'}
];
const scamDefs=[
 {emoji:'📦',label:'詐騙包裹',tip:'陌生到付包裹先查證，不明包裹不要領。'},
 {emoji:'📈',label:'假投資',tip:'保證獲利、穩賺不賠，就是詐騙警訊。'},
 {emoji:'👮',label:'假檢警',tip:'檢警不會要求監管帳戶，也不會叫你操作網銀。'},
 {emoji:'🎧',label:'假客服',tip:'解除分期、誤設會員，請先掛電話再查證。'},
 {emoji:'🎁',label:'假中獎',tip:'先繳費才能領獎，通常就是詐騙。'}
];

function reset(){
 score=0;combo=0;bestCombo=0;goodCaught=0;scamCaught=0;scamAvoided=0;timeLeft=45;starSpawned=false;starTipShown=false;shieldTime=0;
 items=[];particles=[];spawnAcc=0;shake=0;flash=0;basket.x=W/2-basket.w/2;basket.vx=0;
 mayor.x=W/2-mayor.size/2;mayor.dir=1;scoreEl.textContent=0;timeEl.textContent=45;comboEl.textContent=0;
 tip.style.display='none';
}
function spawn(){
 let def,type='good';
 if(Math.random()<.18){def=scamDefs[Math.floor(Math.random()*scamDefs.length)];type='scam';}
 else{def=goodDefs[Math.floor(Math.random()*goodDefs.length)];type=def.type||'good';}
 const x=mayor.x+mayor.size/2+(Math.random()*32-16);
 items.push({x,y:mayor.y+mayor.size-8,vy:(def.speed||215)+Math.random()*70,rot:0,vr:(Math.random()-.5)*5,
 emoji:def.emoji,label:def.label,value:type==='scam'?-40:def.value,r:24,type,tip:def.tip||''});
 throwAnim=.28;
}
function hit(it,b){return it.x+it.r>b.x&&it.x-it.r<b.x+b.w&&it.y+it.r>b.y&&it.y-it.r<b.y+b.h}
function showTip(title,text){
 tipTitle.textContent=title;tipText.textContent=text;tip.style.display='block';
 clearTimeout(tipTimer);tipTimer=setTimeout(()=>tip.style.display='none',1800);
}
function burst(x,y,text,bad=false){
 for(let i=0;i<10;i++){
 particles.push({
  x,y,
  vx:(Math.random()-.5)*130,
  vy:(i===0?-120:-50-Math.random()*100),
  life:1.0,
  txt:i===0?text:'✦',
  bad
 });
}
}
function showScorePopup(x,y,text,bad=false){
 const el=document.createElement('div');
 el.className='scorePopup '+(bad?'bad':'good');
 el.textContent=text;
 el.style.left=x+'px';
 // Keep it comfortably above the basket and away from screen edges.
 el.style.top=Math.max(115,Math.min(H-145,y-28))+'px';
 scoreFxLayer.appendChild(el);
 setTimeout(()=>el.remove(),1200);
}
function catchItem(it){
 if(it.type==='scam'){
  score=Math.max(0,score-40);combo=0;scamCaught++;shake=.35;flash=.35;beep('bad');
  showTip('🚨 '+it.label,it.tip);burst(it.x,it.y,'-40 分',true);showScorePopup(it.x,it.y,'-40 分',true);
 }else{
  combo++;bestCombo=Math.max(bestCombo,combo);goodCaught++;
  const bonus=combo>=10?15:combo>=5?5:0;score+=it.value+bonus;beep(it.type==='star'?'star':'good');
  burst(it.x,it.y,'+'+(it.value+bonus)+' 分',false);showScorePopup(it.x,it.y,'+'+(it.value+bonus)+' 分',false);
  if(it.type==='star'){{
    shieldTime=5;
    flash=.18;
    if(!starTipShown){{
      showTip('🛡️ 反詐護盾啟動！','遇到可疑訊息，先停、先查，再撥 165。護盾將持續 5 秒。');
      starTipShown=true;
    }}
  }}
 }
 scoreEl.textContent=score;comboEl.textContent=combo;
}
function update(dt){
 mayor.x+=mayor.dir*72*dt;if(mayor.x<12){mayor.x=12;mayor.dir=1}if(mayor.x+mayor.size>W-12){mayor.x=W-12-mayor.size;mayor.dir=-1}
 basket.x+=basket.vx*dt;basket.x=Math.max(0,Math.min(W-basket.w,basket.x));
 spawnAcc+=dt;const interval=Math.max(.30,.66-(45-timeLeft)*.005);
 if(spawnAcc>interval){spawnAcc=0;spawn()}
 throwAnim=Math.max(0,throwAnim-dt);shake=Math.max(0,shake-dt);flash=Math.max(0,flash-dt);shieldTime=Math.max(0,shieldTime-dt);
 warning.style.opacity=flash>0?String(Math.min(1,flash*3)):0;
 for(let i=items.length-1;i>=0;i--){
  const it=items[i];it.y+=it.vy*dt;it.rot+=it.vr*dt;
  if(hit(it,basket)){catchItem(it);items.splice(i,1);continue}
  if(it.y-it.r>H){if(it.type==='scam')scamAvoided++;items.splice(i,1)}
 }
 for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=180*dt;if(p.life<=0)particles.splice(i,1)}
}
function roundedPath(x,y,w,h,r){
 r=Math.max(0,Math.min(r,Math.abs(w)/2,Math.abs(h)/2));
 ctx.beginPath();
 ctx.moveTo(x+r,y);
 ctx.lineTo(x+w-r,y);
 ctx.quadraticCurveTo(x+w,y,x+w,y+r);
 ctx.lineTo(x+w,y+h-r);
 ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
 ctx.lineTo(x+r,y+h);
 ctx.quadraticCurveTo(x,y+h,x,y+h-r);
 ctx.lineTo(x,y+r);
 ctx.quadraticCurveTo(x,y,x+r,y);
 ctx.closePath();
}
function rr(x,y,w,h,r,fill,stroke,lw=3){
 roundedPath(x,y,w,h,r);
 if(fill){ctx.fillStyle=fill;ctx.fill()}
 if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}
}
function bg(){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#bfeaff');g.addColorStop(.61,'#fff1bf');g.addColorStop(1,'#f6c76f');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.globalAlpha=.25;ctx.fillStyle='#fff';
 for(let i=0;i<7;i++){let x=(i*91+performance.now()*.013)%(W+120)-60,y=190+(i%3)*86;ctx.beginPath();ctx.arc(x,y,25,0,7);ctx.arc(x+27,y+2,18,0,7);ctx.arc(x-28,y+4,17,0,7);ctx.fill()}
 ctx.globalAlpha=1;ctx.fillStyle='#79c965';ctx.fillRect(0,H-125,W,125);
 ctx.fillStyle='#91dc76';for(let x=0;x<W;x+=36){ctx.beginPath();ctx.arc(x,H-125,33,Math.PI,0);ctx.fill()}
}
function drawMayor(){
 const bob=throwAnim>0?-13*Math.sin((.28-throwAnim)/.28*Math.PI):0;
 ctx.save();ctx.beginPath();ctx.arc(mayor.x+mayor.size/2,mayor.y+mayor.size/2+bob,mayor.size/2,0,7);ctx.clip();
 ctx.drawImage(mayorImg,mayor.x,mayor.y+bob,mayor.size,mayor.size);ctx.restore();
 ctx.beginPath();ctx.arc(mayor.x+mayor.size/2,mayor.y+mayor.size/2+bob,mayor.size/2,0,7);ctx.strokeStyle='#1d6a59';ctx.lineWidth=5;ctx.stroke();
}
function drawItem(it){
 ctx.save();ctx.translate(it.x,it.y);ctx.rotate(it.rot);
 if(it.type==='scam'){
  rr(-48,-31,96,62,13,'#fff','#d82920',3);ctx.font='25px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(it.emoji,0,-10);
  ctx.font='900 14px sans-serif';ctx.fillStyle='#c52219';ctx.fillText(it.label,0,16);
 }else{
  if(it.type==='star'){ctx.shadowColor='#fff';ctx.shadowBlur=18}
  ctx.font='48px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(it.emoji,0,0);
 }
 ctx.restore();
}
function drawBasket(){
 const x=basket.x,y=basket.y,w=basket.w,h=basket.h;ctx.lineCap='round';ctx.strokeStyle='#754416';ctx.lineWidth=8;
 ctx.beginPath();ctx.arc(x+w/2,y+11,w*.34,Math.PI,0);ctx.stroke();
 const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,'#ffd36f');g.addColorStop(1,'#bd6e20');rr(x,y+11,w,h-11,15,g,'#754416',3);
 ctx.strokeStyle='#965817';ctx.lineWidth=3;for(let i=1;i<5;i++){ctx.beginPath();ctx.moveTo(x+i*w/5,y+14);ctx.lineTo(x+i*w/5,y+h-3);ctx.stroke()}
}
function draw(){
 ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*12,(Math.random()-.5)*10);
 bg();drawMayor();items.forEach(drawItem);drawBasket();drawShield();
 for(const p of particles){
 ctx.globalAlpha=Math.max(0,p.life/.7);
 if(p.txt==='✦'){
   ctx.font='22px serif';
   ctx.textAlign='center';
   ctx.fillStyle='#ffd54a';
   ctx.fillText('✦',p.x,p.y);
 }else{
   ctx.font='900 28px sans-serif';
   ctx.textAlign='center';
   ctx.lineWidth=5;
   ctx.strokeStyle='#ffffff';
   ctx.strokeText(p.txt,p.x,p.y);
   ctx.fillStyle=p.bad?'#e02020':'#0d8a49';
   ctx.fillText(p.txt,p.x,p.y);
 }
}
 ctx.globalAlpha=1;ctx.restore();
}
function loop(t){
 try{
  if(!last)last=t;
  const dt=Math.min(.033,(t-last)/1000);
  last=t;
  if(playing)update(dt);
  draw();
 }catch(err){
  console.error('遊戲迴圈錯誤：',err);
 }
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);


function getLeaders(){
 try{return JSON.parse(localStorage.getItem('tainanSweetLeaders')||'[]')}catch(e){return []}
}
function saveLeader(value){
 const list=getLeaders();
 list.push({score:value,date:new Date().toLocaleDateString('zh-TW')});
 list.sort((a,b)=>b.score-a.score);
 localStorage.setItem('tainanSweetLeaders',JSON.stringify(list.slice(0,5)));
}
function leaderHTML(){
 const list=getLeaders();
 if(!list.length)return '<div style="text-align:center;color:#777;font-weight:800">尚無紀錄，等你來挑戰！</div>';
 return '<ol id="leaderList">'+list.map(x=>`<li>${x.score} 分　<small>${x.date}</small></li>`).join('')+'</ol>';
}
function showToast(msg){
 toast.textContent=msg;toast.style.display='block';
 clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.style.display='none',1800);
}
async function shareGame(){
 const data={title:'臺南甜甜接好運 Version 3.0',text:'接住甜甜好運，避開詐騙套路！一起挑戰反詐小遊戲。',url:location.href};
 try{
  if(navigator.share){await navigator.share(data)}
  else if(navigator.clipboard){await navigator.clipboard.writeText(location.href);showToast('連結已複製')}
  else{showToast('請複製瀏覽器網址分享')}
 }catch(e){}
}
shareBtn.onclick=shareGame;

function start(){
 reset();scoreFxLayer.innerHTML='';dragging=false;if(moveHint)moveHint.style.display='block';overlay.style.display='none';playing=true;last=0;clearInterval(timer);
 setTimeout(()=>{if(playing)spawn()},250);
 timer=setInterval(()=>{if(!playing)return;timeLeft--;timeEl.textContent=timeLeft;if(timeLeft<=0)end()},1000);
}
function end(){
 playing=false;dragging=false;scoreFxLayer.innerHTML='';clearInterval(timer);tip.style.display='none';beep('win');saveLeader(score);
 let rank='🥉 防詐小尖兵',msg='多一分警覺，就少一分受騙風險。';
 if(score>=1000){rank='👑 反詐神射手';msg='詐騙陷阱全都逃不過你的眼睛！'}
 else if(score>=700){rank='🥇 165反詐守護者';msg='你已具備優秀的反詐辨識力！'}
 else if(score>=400){rank='🥈 臺南反詐達人';msg='好物接得準，詐騙也看得清！'}
 overlay.innerHTML=`<div class="card"><h1>挑戰完成</h1><div class="versionTag">Version 3.0</div><div class="rank">${rank}</div>
 <div style="font-size:52px;font-weight:900;color:#ed6539;margin:8px">${score} 分</div>
 <div class="stats"><div class="stat">接住好物<br>${goodCaught}</div><div class="stat">避開詐騙<br>${scamAvoided}</div><div class="stat">誤接詐騙<br>${scamCaught}</div><div class="stat">最高連擊<br>${bestCombo}</div></div>
 <p style="font-weight:900;color:#5a4430">${msg}</p>
 <div class="rules" style="text-align:center">反詐三步驟：<br><b>先停一下・冷靜查證・撥打 165</b></div>
 <div id="leaderPanel"><h3>🏆 本機排行榜</h3>${leaderHTML()}</div>
 <button id="again">再玩一次</button>
 <button id="shareScore" style="background:#1b7966;box-shadow:0 6px 0 #0f4d40;margin-left:6px">分享成績</button>
 </div>`;
 overlay.style.display='flex';
 document.getElementById('again').onclick=start;
 document.getElementById('shareScore').onclick=async()=>{
   const text=`我在「臺南甜甜接好運 Version 3.0」獲得 ${score} 分，稱號：${rank.replace(/<[^>]*>/g,'')}！一起來挑戰反詐力！`;
   try{
     if(navigator.share)await navigator.share({title:'臺南甜甜接好運',text,url:location.href});
     else if(navigator.clipboard){await navigator.clipboard.writeText(text+' '+location.href);showToast('成績與連結已複製')}
   }catch(e){}
 };
}
document.getElementById('start').onclick=start;
function moveTo(clientX){
  const r=c.getBoundingClientRect();
  const scaleX=W/r.width;
  basket.x=(clientX-r.left)*scaleX-basket.w/2;
  basket.x=Math.max(0,Math.min(W-basket.w,basket.x));
}

let dragging=false;

function beginDrag(clientX){
  if(!playing)return;
  dragging=true;
  if(moveHint)moveHint.style.display='none';
  basket.vx=0;
  moveTo(clientX);
}
function continueDrag(clientX){
  if(!playing||!dragging)return;
  moveTo(clientX);
}
function endDrag(){
  dragging=false;
}

/* Pointer Events */
if(window.PointerEvent){
  c.addEventListener('pointerdown',e=>{
    beginDrag(e.clientX);
    try{c.setPointerCapture(e.pointerId)}catch(err){}
    e.preventDefault();
  },{passive:false});
  c.addEventListener('pointermove',e=>{
    continueDrag(e.clientX);
    e.preventDefault();
  },{passive:false});
  c.addEventListener('pointerup',e=>{
    endDrag();
    try{c.releasePointerCapture(e.pointerId)}catch(err){}
    e.preventDefault();
  },{passive:false});
  c.addEventListener('pointercancel',endDrag,{passive:false});
}

/* Touch fallback for in-app browsers / older WebViews */
c.addEventListener('touchstart',e=>{
  if(e.touches&&e.touches[0])beginDrag(e.touches[0].clientX);
  e.preventDefault();
},{passive:false});
c.addEventListener('touchmove',e=>{
  if(e.touches&&e.touches[0])continueDrag(e.touches[0].clientX);
  e.preventDefault();
},{passive:false});
c.addEventListener('touchend',e=>{
  endDrag();
  e.preventDefault();
},{passive:false});
c.addEventListener('touchcancel',endDrag,{passive:false});

/* Mouse fallback */
c.addEventListener('mousedown',e=>{
  beginDrag(e.clientX);
  e.preventDefault();
});
window.addEventListener('mousemove',e=>{
  continueDrag(e.clientX);
});
window.addEventListener('mouseup',endDrag);

/* Keyboard */
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'){basket.vx=-420;e.preventDefault()}
  if(e.key==='ArrowRight'){basket.vx=420;e.preventDefault()}
});
addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'&&basket.vx<0)basket.vx=0;
  if(e.key==='ArrowRight'&&basket.vx>0)basket.vx=0;
});
</script>
