<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>臺南甜甜接好運｜活動已結束</title>
<style>
html,body{height:100%;margin:0}
body{
  display:flex;align-items:center;justify-content:center;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;
  background:linear-gradient(180deg,#fff7d8 0%,#ffe6a6 48%,#ffd58c 100%);
  color:#603d20;text-align:center;padding:24px;box-sizing:border-box;
}
.card{
  width:min(92vw,520px);padding:34px 24px 30px;box-sizing:border-box;
  border-radius:28px;background:rgba(255,255,255,.92);
  border:3px solid #f0bd58;box-shadow:0 14px 38px rgba(106,65,20,.18);
}
.icon{font-size:64px;margin-bottom:12px}
h1{font-size:clamp(25px,7vw,36px);margin:0 0 18px;font-weight:1000;letter-spacing:1px}
.msg{font-size:clamp(20px,5.5vw,28px);line-height:1.55;font-weight:900}
.sub{margin-top:18px;font-size:15px;opacity:.72}
</style>
</head>
<body>
  <main class="card">
    <div class="icon">🦆🍬</div>
    <h1>臺南甜甜接好運</h1>
    <div class="msg">活動已結束<br>期待下次再相會</div>
    <div class="sub">感謝大家的熱情參與 💛</div>
  </main>
</body>
</html>
