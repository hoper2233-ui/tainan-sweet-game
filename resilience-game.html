<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#10243a">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>臺南城鎮韌性 Mission 2.1</title>
<link rel="manifest" href="manifest.json?b=20260726154915">
<style>
html,body{margin:0;width:100%;height:100%;background:#091521;color:#fff;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}
#loading{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
.spinner{width:48px;height:48px;margin:0 auto 18px;border:5px solid #ffffff33;border-top-color:#ffd54a;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
button{border:0;border-radius:14px;padding:12px 18px;font-weight:900;background:#ffd54a;color:#14253b}
small{display:block;margin-top:12px;color:#c9e6fa}
</style>
</head>
<body>
<div id="loading"><div><div class="spinner"></div><h2>正在載入最新版本</h2><p>不需要清除 LINE 或瀏覽器快取</p><small>Mission 2.1</small></div></div>
<script>
(async()=>{
  const stamp=Date.now();
  try{
    if('serviceWorker' in navigator){
      navigator.serviceWorker.register(`sw.js?b=${stamp}`,{updateViaCache:'none'})
        .then(reg=>reg.update()).catch(()=>{});
    }
    const response=await fetch(`game-app.html?_=${stamp}`,{
      cache:'no-store',
      headers:{'Cache-Control':'no-cache, no-store, max-age=0','Pragma':'no-cache'}
    });
    if(!response.ok) throw new Error(`HTTP ${response.status}`);
    const html=await response.text();
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.getElementById('loading').innerHTML=
      `<div><h2>⚠️ 最新版本載入失敗</h2><p>請確認網路連線後再試一次。</p><button onclick="location.reload()">重新載入</button><small>${String(error)}</small></div>`;
  }
})();
</script>
</body>
</html>
